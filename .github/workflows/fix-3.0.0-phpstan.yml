name: Fix Image Usage Audit 3.0.0 PHPStan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/fix-3.0.0-phpstan.yml'

permissions:
  contents: write

concurrency:
  group: fix-image-usage-audit-3.0.0-phpstan
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/wordpress-org-submission-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/wordpress-org-submission-assets
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the local brand asset without a custom constant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('views/admin-page.php')
          content = path.read_text(encoding='utf-8')
          old = "esc_url( IUA_URL . 'assets/image-usage-audit-mark.svg' )"
          new = "esc_url( plugins_url( 'assets/image-usage-audit-mark.svg', dirname( __DIR__ ) . '/image-usage-audit.php' ) )"
          if old not in content:
              raise SystemExit('Expected Image Usage Audit brand URL was not found.')
          path.write_text(content.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Validate the focused correction
        run: |
          npm ci
          composer install --no-interaction --prefer-dist
          composer analyse
          php -l views/admin-page.php
          npm run validate:metadata
          npm run build:zip

      - name: Commit the correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -- views/admin-page.php
          git commit -m 'fix: resolve the bundled brand asset for static analysis'
          git push origin HEAD:chore/wordpress-org-submission-assets
