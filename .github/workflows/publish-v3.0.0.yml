name: Publish Image Usage Audit 3.0.0

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/publish-v3.0.0.yml'

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: publish-image-usage-audit-3.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/v3.0.0-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: v3.0.0
      RELEASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release identity
        run: |
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          node scripts/validate-release-tag.mjs "$RELEASE_TAG"
          test "$(node -e "const fs=require('fs'); const m=fs.readFileSync('image-usage-audit.php','utf8').match(/Version:\s*(\d+\.\d+\.\d+)/); process.stdout.write(m[1]);")" = "3.0.0"

      - name: Install and audit development dependencies
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Validate metadata and build the production ZIP
        run: |
          npm run validate:metadata
          npm run validate:config
          npm run build:zip
          cd dist
          sha256sum --check --strict image-usage-audit.zip.sha256

      - name: Test the exact production ZIP in WordPress
        run: |
          npx wp-env start
          npx wp-env run cli wp plugin deactivate WP_image_usage_audit
          npx wp-env run cli wp plugin install /var/www/html/wp-content/plugins/WP_image_usage_audit/dist/image-usage-audit.zip --activate
          npx wp-env run cli wp plugin is-active image-usage-audit
          npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/WP_image_usage_audit/tests/integration/ajax-setup.php
          npm run test:ajax
          npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/WP_image_usage_audit/tests/integration/smoke.php
          npx wp-env run cli wp plugin install plugin-check --version=2.0.0 --activate
          npx wp-env run cli wp plugin check image-usage-audit

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop || true

      - name: Attest the tested production ZIP
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/image-usage-audit.zip

      - name: Preserve the tested release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-usage-audit-3.0.0-release-files
          path: |
            dist/image-usage-audit.zip
            dist/image-usage-audit.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Create the immutable tag and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists." >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            --method POST \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$RELEASE_SHA"

          cat > release-notes.md <<'EOF'
          ## Image Usage Audit 3.0.0

          Version 3.0.0 applies the complete Image Usage Audit visual identity while preserving the plugin's non-destructive audit behavior.

          ### Highlights

          - Added a responsive navy and teal branded administration header.
          - Bundled the Image Usage Audit mark locally with no remote resources or tracking.
          - Added the project banner to the GitHub README.
          - Added WordPress.org banner and icon resources, submission documentation, and SVN publication helpers.
          - Preserved WordPress 5.9+, PHP 7.4+, multisite support, existing security controls, provenance reporting, CSV export, manual review tools, and CDN rewrite support.

          The release ZIP was built reproducibly, installed and activated in WordPress, checked with Plugin Check, tested through the authenticated AJAX and smoke-test flows, checksummed, and supplied with a GitHub provenance attestation.
          EOF

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --verify-tag \
            --draft \
            --title "Image Usage Audit 3.0.0" \
            --notes-file release-notes.md

          gh release upload "$RELEASE_TAG" \
            dist/image-usage-audit.zip \
            dist/image-usage-audit.zip.sha256 \
            --repo "$GITHUB_REPOSITORY"

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

          gh release verify-asset "$RELEASE_TAG" dist/image-usage-audit.zip --repo "$GITHUB_REPOSITORY"
