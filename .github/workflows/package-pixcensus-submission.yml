name: Package PixCensus WordPress.org submission

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/package-pixcensus-submission.yml'

permissions:
  contents: read

concurrency:
  group: package-pixcensus-submission
  cancel-in-progress: true

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/pixcensus-rebrand-3.0.1-work'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/pixcensus-rebrand-3.0.1-work
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build the exact submission ZIP
        run: |
          npm ci
          npm audit --audit-level=high
          npm run validate:metadata
          npm run validate:config
          npm run validate:branding
          npm run build:zip
          cd dist
          sha256sum --check --strict pixcensus-media-audit.zip.sha256

      - name: Install and test the exact submission ZIP
        run: |
          npx wp-env start
          npx wp-env run cli wp plugin deactivate WP_image_usage_audit
          npx wp-env run cli wp plugin install /var/www/html/wp-content/plugins/WP_image_usage_audit/dist/pixcensus-media-audit.zip --activate
          npx wp-env run cli wp plugin is-active pixcensus-media-audit
          npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/WP_image_usage_audit/tests/integration/ajax-setup.php
          npm run test:ajax
          npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/WP_image_usage_audit/tests/integration/smoke.php
          npx wp-env run cli wp plugin install plugin-check --version=2.0.0 --activate
          npx wp-env run cli wp plugin check pixcensus-media-audit

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop || true

      - name: Assemble submission resources
        run: |
          mkdir -p submission/plugin submission/assets submission/documentation
          cp dist/pixcensus-media-audit.zip submission/plugin/
          cp dist/pixcensus-media-audit.zip.sha256 submission/plugin/
          cp .wordpress-org/banner-772x250.png submission/assets/
          cp .wordpress-org/banner-1544x500.png submission/assets/
          cp .wordpress-org/icon-128x128.png submission/assets/
          cp .wordpress-org/icon-256x256.png submission/assets/
          cp .wordpress-org/banner-source.svg submission/assets/
          cp .wordpress-org/icon.svg submission/assets/
          cp readme.txt submission/documentation/
          cp docs/wordpress-org/review-response-template.txt submission/documentation/
          cp docs/wordpress-org/branding.md submission/documentation/
          cp docs/wordpress-org/submission-form.txt submission/documentation/
          cp docs/wordpress-org/screenshot-plan.md submission/documentation/
          cp docs/wordpress-org/svn-publication.md submission/documentation/

      - name: Upload the validated submission bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixcensus-media-audit-3.0.1-wordpress-org-final
          path: submission/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
