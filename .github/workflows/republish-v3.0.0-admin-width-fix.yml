name: Republish Image Usage Audit 3.0.0 admin width fix

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/republish-v3.0.0-admin-width-fix.yml'

permissions:
  contents: write
  attestations: read

concurrency:
  group: republish-image-usage-audit-3.0.0-admin-width-fix
  cancel-in-progress: false

jobs:
  republish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/v3.0.0-admin-width-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: v3.0.0
      RELEASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_ZIP_SHA256: 6807d10a7d8f555f43e3d5257370d1d6a2c1af03d1da8a6ae931da2d100ee4db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Rebuild the exact validated fixed package
        run: |
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "389a61e06a83b3a4d18406545d5b298219e70a5b"
          node scripts/validate-release-tag.mjs "$RELEASE_TAG"
          if grep -Eq '#iua-admin[[:space:]]*\{[^}]*\b(max-width|width)[[:space:]]*:' assets/admin.css; then
            echo 'The fixed admin container still has a width cap.' >&2
            exit 1
          fi
          npm ci
          npm audit --audit-level=high
          npm run validate:metadata
          npm run validate:config
          npm run build:zip
          cd dist
          sha256sum --check --strict image-usage-audit.zip.sha256
          test "$(sha256sum image-usage-audit.zip | cut -d' ' -f1)" = "$EXPECTED_ZIP_SHA256"

      - name: Verify the existing fixed-package provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/image-usage-audit.zip --repo "$GITHUB_REPOSITORY"

      - name: Replace the 3.0.0 release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

          cat > release-notes.md <<'EOF'
          ## Image Usage Audit 3.0.0

          Version 3.0.0 applies the complete Image Usage Audit visual identity while preserving the plugin's non-destructive audit behavior.

          ### Highlights

          - Added a responsive navy and teal branded administration header.
          - Bundled the Image Usage Audit mark locally with no remote resources or tracking.
          - Added the project banner to the GitHub README.
          - Added WordPress.org banner and icon resources, submission documentation, and SVN publication helpers.
          - Preserved WordPress 5.9+, PHP 7.4+, multisite support, existing security controls, provenance reporting, CSV export, manual review tools, and CDN rewrite support.

          ### Included layout correction

          - Removed the accidental 1440px maximum width from the main administration container.
          - The hero, settings cards, controls, tabs, and results table now use the full WordPress content width while retaining the native administration margins and responsive layout.
          - Corrected package commit: `389a61e06a83b3a4d18406545d5b298219e70a5b`.

          The downloadable ZIP was rebuilt from the corrected `main` commit, installed and activated in WordPress, checked with Plugin Check, tested through the authenticated AJAX and smoke-test flows, checksummed, and supplied with GitHub provenance attestation `38412666`.

          The protected `v3.0.0` Git ref remains immutable; the release ZIP and checksum below are the corrected official 3.0.0 package.
          EOF

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Image Usage Audit 3.0.0" \
            --notes-file release-notes.md

          gh release upload "$RELEASE_TAG" \
            dist/image-usage-audit.zip \
            dist/image-usage-audit.zip.sha256 \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify the public corrected package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir public-release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'image-usage-audit.zip' \
            --pattern 'image-usage-audit.zip.sha256' \
            --dir public-release

          cd public-release
          sha256sum --check --strict image-usage-audit.zip.sha256
          test "$(sha256sum image-usage-audit.zip | cut -d' ' -f1)" = "$EXPECTED_ZIP_SHA256"
