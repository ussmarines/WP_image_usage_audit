name: Republish Image Usage Audit 3.0.0 admin width fix

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/republish-v3.0.0-admin-width-fix.yml'

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: republish-image-usage-audit-3.0.0-admin-width-fix
  cancel-in-progress: false

jobs:
  republish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/v3.0.0-admin-width-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_TAG: v3.0.0
      RELEASE_SHA: ${{ github.event.pull_request.base.sha }}
      EXPECTED_ZIP_SHA256: 88f06f237f8bf6956d83e5833dbe67135d52df3f87845025a32d737124166aa4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify exact fixed release source
        run: |
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "389a61e06a83b3a4d18406545d5b298219e70a5b"
          node scripts/validate-release-tag.mjs "$RELEASE_TAG"
          test "$(node -e "const fs=require('fs'); const m=fs.readFileSync('image-usage-audit.php','utf8').match(/Version:\s*(\d+\.\d+\.\d+)/); process.stdout.write(m[1]);")" = "3.0.0"
          if grep -Eq '#iua-admin[[:space:]]*\{[^}]*\b(max-width|width)[[:space:]]*:' assets/admin.css; then
            echo 'The fixed admin container still has a width cap.' >&2
            exit 1
          fi

      - name: Install and audit development dependencies
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Validate metadata and build the fixed production ZIP
        run: |
          npm run validate:metadata
          npm run validate:config
          npm run build:zip
          cd dist
          sha256sum --check --strict image-usage-audit.zip.sha256
          test "$(sha256sum image-usage-audit.zip | cut -d' ' -f1)" = "$EXPECTED_ZIP_SHA256"

      - name: Test the exact fixed ZIP in WordPress
        run: |
          npx wp-env start
          npx wp-env run cli wp plugin deactivate WP_image_usage_audit
          npx wp-env run cli wp plugin install /var/www/html/wp-content/plugins/WP_image_usage_audit/dist/image-usage-audit.zip --activate
          npx wp-env run cli wp plugin is-active image-usage-audit
          npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/WP_image_usage_audit/tests/integration/ajax-setup.php
          npm run test:ajax
          npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/WP_image_usage_audit/tests/integration/smoke.php
          npx wp-env run cli wp plugin install plugin-check --version=2.0.0 --activate
          npx wp-env run cli wp plugin check image-usage-audit

      - name: Stop WordPress
        if: always()
        run: npx wp-env stop || true

      - name: Attest the fixed production ZIP
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/image-usage-audit.zip

      - name: Verify the new provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/image-usage-audit.zip --repo "$GITHUB_REPOSITORY"

      - name: Preserve the fixed release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-usage-audit-3.0.0-admin-width-fix-release-files
          path: |
            dist/image-usage-audit.zip
            dist/image-usage-audit.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Move the 3.0.0 tag and replace the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

          gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
            --method PATCH \
            -f sha="$RELEASE_SHA" \
            -F force=true

          cat > release-notes.md <<'EOF'
          ## Image Usage Audit 3.0.0

          Version 3.0.0 applies the complete Image Usage Audit visual identity while preserving the plugin's non-destructive audit behavior.

          ### Highlights

          - Added a responsive navy and teal branded administration header.
          - Bundled the Image Usage Audit mark locally with no remote resources or tracking.
          - Added the project banner to the GitHub README.
          - Added WordPress.org banner and icon resources, submission documentation, and SVN publication helpers.
          - Preserved WordPress 5.9+, PHP 7.4+, multisite support, existing security controls, provenance reporting, CSV export, manual review tools, and CDN rewrite support.

          ### Included layout correction

          - Removed the accidental 1440px maximum width from the main administration container.
          - The hero, settings cards, controls, tabs, and results table now use the full WordPress content width while retaining the native administration margins and responsive layout.

          The downloadable ZIP was rebuilt from the corrected `main` commit, installed and activated in WordPress, checked with Plugin Check, tested through the authenticated AJAX and smoke-test flows, checksummed, and supplied with a new GitHub provenance attestation.
          EOF

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Image Usage Audit 3.0.0" \
            --notes-file release-notes.md

          gh release upload "$RELEASE_TAG" \
            dist/image-usage-audit.zip \
            dist/image-usage-audit.zip.sha256 \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify the public fixed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          test "$tag_sha" = "$RELEASE_SHA"

          mkdir public-release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'image-usage-audit.zip' \
            --pattern 'image-usage-audit.zip.sha256' \
            --dir public-release

          cd public-release
          sha256sum --check --strict image-usage-audit.zip.sha256
          test "$(sha256sum image-usage-audit.zip | cut -d' ' -f1)" = "$EXPECTED_ZIP_SHA256"
