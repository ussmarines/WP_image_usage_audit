name: Prepare Image Usage Audit 3.0.0

on:
  push:
    branches:
      - chore/wordpress-org-submission-assets
    paths:
      - '.github/workflows/prepare-3.0.0.yml'

permissions:
  contents: write

concurrency:
  group: prepare-image-usage-audit-3.0.0
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/wordpress-org-submission-assets
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the 3.0.0 branding and metadata update
        env:
          PATCH_SCRIPT_GZIP_BASE64: >-
            
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          script = gzip.decompress(base64.b64decode(os.environ['PATCH_SCRIPT_GZIP_BASE64'])).decode()
          exec(compile(script, '<prepare-3.0.0>', 'exec'))
          PY

      - name: Validate generated metadata and package
        run: |
          npm ci
          npm run validate:metadata
          npm run validate:config
          php -l image-usage-audit.php
          php -l views/admin-page.php
          npm run build:zip

      - name: Commit the prepared release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -- README.md readme.txt image-usage-audit.php languages/image-usage-audit.pot assets/admin.css assets/image-usage-audit-mark.svg views/admin-page.php scripts/validate-metadata.mjs scripts/verify-wordpress-org-submission.ps1 scripts/prepare-wordpress-org-svn.ps1 docs/wordpress-org .wordpress-org .github/workflows/publish-3.0.0.yml
          git add -u -- .github/workflows/prepare-3.0.0.yml
          git commit -m 'feat: apply 3.0.0 visual identity and release metadata'
          git push origin HEAD:chore/wordpress-org-submission-assets
