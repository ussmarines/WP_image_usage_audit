name: Security and secret guard

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tracked files and private identity
        run: python3 .github/scripts/security_guard.py

      - name: Install verified Gitleaks binary
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan current tree with redaction
        id: incremental
        continue-on-error: true
        run: gitleaks dir . --redact=100 --verbose --exit-code=2 --max-archive-depth=1

      - name: Scan complete history with redaction
        id: full_history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/security/secret-hardening-2026-08-04'
        continue-on-error: true
        run: gitleaks git . --redact=100 --verbose --exit-code=2 --log-opts="--all" --max-archive-depth=1

      - name: Enforce scan results
        if: always()
        env:
          INCREMENTAL_OUTCOME: ${{ steps.incremental.outcome }}
          FULL_HISTORY_OUTCOME: ${{ steps.full_history.outcome }}
        shell: bash
        run: |
          failed=0
          if [[ "$INCREMENTAL_OUTCOME" != "success" ]]; then
            echo "The current-tree secret scan failed or detected a finding."
            failed=1
          fi
          if [[ "$FULL_HISTORY_OUTCOME" != "skipped" && "$FULL_HISTORY_OUTCOME" != "success" ]]; then
            echo "The complete-history secret scan failed or detected a finding."
            failed=1
          fi
          exit "$failed"
