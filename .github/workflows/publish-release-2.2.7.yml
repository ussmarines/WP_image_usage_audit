name: Publish release 2.2.7

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: publish-release-2.2.7
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/v2.2.7-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release identity
        env:
          RELEASE_TAG: v2.2.7
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          node scripts/validate-release-tag.mjs "$RELEASE_TAG"
          test "$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('.github/release-request.json','utf8'));process.stdout.write(r.version)")" = "2.2.7"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run validate:metadata
      - run: npm run validate:config
      - run: npm run build:zip
      - run: npx wp-env start
      - run: npx wp-env run cli wp plugin deactivate WP_image_usage_audit
      - run: npx wp-env run cli wp plugin install /var/www/html/wp-content/plugins/WP_image_usage_audit/dist/image-usage-audit.zip --activate
      - run: npx wp-env run cli wp plugin is-active image-usage-audit
      - run: npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/WP_image_usage_audit/tests/integration/ajax-setup.php
      - run: npm run test:ajax
      - run: npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/WP_image_usage_audit/tests/integration/smoke.php
      - run: npx wp-env run cli wp plugin install plugin-check --version=2.0.0 --activate
      - run: npx wp-env run cli wp plugin check image-usage-audit
      - name: Stop WordPress
        if: always()
        run: npx wp-env stop
      - name: Attest tested ZIP
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/image-usage-audit.zip
      - name: Verify checksum and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check --strict image-usage-audit.zip.sha256
          gh attestation verify image-usage-audit.zip --repo "$GITHUB_REPOSITORY"
      - name: Create tag and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2.2.7
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$existing_sha" != "$TARGET_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to $existing_sha, expected $TARGET_SHA." >&2
              exit 1
            fi
          else
            existing_sha=""
          fi

          if [[ -z "$existing_sha" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$TARGET_SHA"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Image Usage Audit 2.2.7"
          gh release upload "$RELEASE_TAG" \
            dist/image-usage-audit.zip \
            dist/image-usage-audit.zip.sha256 \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
