name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-attest:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release/v2.2.7-final')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      release_tag: ${{ steps.release-context.outputs.tag }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve and verify release identity
        id: release-context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            release_tag="$REF_NAME"
          else
            release_version="$(node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('.github/release-request.json','utf8'));if(!/^\d+\.\d+\.\d+$/.test(r.version||'')){process.exit(1)}process.stdout.write(r.version)")"
            release_tag="v${release_version}"
          fi
          node scripts/validate-release-tag.mjs "$release_tag"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run validate:metadata
      - run: npm run validate:config
      - run: npm run build:zip
      - run: npx wp-env start
      - run: npx wp-env run cli wp plugin deactivate WP_image_usage_audit
      - run: npx wp-env run cli wp plugin install /var/www/html/wp-content/plugins/WP_image_usage_audit/dist/image-usage-audit.zip --activate
      - run: npx wp-env run cli wp plugin is-active image-usage-audit
      - run: npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/WP_image_usage_audit/tests/integration/ajax-setup.php
      - run: npm run test:ajax
      - run: npx wp-env run cli wp eval-file /var/www/html/wp-content/plugins/WP_image_usage_audit/tests/integration/smoke.php
      - run: npx wp-env run cli wp plugin install plugin-check --version=2.0.0 --activate
      - run: npx wp-env run cli wp plugin check image-usage-audit
      - name: Stop WordPress
        if: always()
        run: npx wp-env stop
      - name: Attest tested ZIP
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/image-usage-audit.zip
      - name: Upload tested release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: |
            dist/image-usage-audit.zip
            dist/image-usage-audit.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build-test-attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - name: Download tested release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - name: Verify checksum and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check --strict image-usage-audit.zip.sha256
          gh attestation verify image-usage-audit.zip --repo "$GITHUB_REPOSITORY"
      - name: Create release tag after protected merge
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-test-attest.outputs.release_tag }}
        run: |
          existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to $existing_sha, expected $GITHUB_SHA." >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA"
          fi
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-test-attest.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Image Usage Audit ${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            release/image-usage-audit.zip \
            release/image-usage-audit.zip.sha256 \
            --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
