name: Restore reproducible POT metadata

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: fix-pot-2.2.9-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix-pot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/v2.2.9-donation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npx wp-env start
      - name: Regenerate canonical POT
        run: >-
          npx wp-env run cli wp i18n make-pot
          /var/www/html/wp-content/plugins/WP_image_usage_audit
          /var/www/html/wp-content/plugins/WP_image_usage_audit/languages/image-usage-audit.pot
          --domain=image-usage-audit
          --exclude=.agents,docs,tests,vendor,node_modules,scripts,dist
          --headers='{"POT-Creation-Date":"2026-07-13T12:43:54+00:00","Report-Msgid-Bugs-To":"https://github.com/ussmarines/WP_image_usage_audit/issues"}'
      - name: Stop WordPress
        if: always()
        run: npx wp-env stop
      - name: Commit canonical POT and remove helper
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm -- .github/workflows/fix-pot-2.2.9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- languages/image-usage-audit.pot .github/workflows/fix-pot-2.2.9.yml
          git diff --cached --check
          git commit -m "chore: restore reproducible POT metadata"
          git push origin "HEAD:${HEAD_BRANCH}"
