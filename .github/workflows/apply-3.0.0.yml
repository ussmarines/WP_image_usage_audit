name: Apply Image Usage Audit 3.0.0

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/apply-3.0.0.yml'

permissions:
  contents: write

concurrency:
  group: apply-image-usage-audit-3.0.0
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chore/wordpress-org-submission-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/wordpress-org-submission-assets
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the reviewed 3.0.0 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re

          workflow = Path('.github/workflows/prepare-3.0.0-pr.yml').read_text(encoding='utf-8').splitlines()
          payload_lines = []
          collecting = False
          for line in workflow:
              if 'PATCH_SCRIPT_GZIP_BASE64: >-' in line:
                  collecting = True
                  continue
              if collecting:
                  if line.startswith('            '):
                      payload_lines.append(line.strip())
                      continue
                  break

          if not payload_lines:
              raise SystemExit('Unable to locate the reviewed 3.0.0 patch payload.')

          script = gzip.decompress(base64.b64decode(''.join(payload_lines))).decode()
          exec(compile(script, '<prepare-3.0.0>', 'exec'))

          pot_path = Path('languages/image-usage-audit.pot')
          pot = pot_path.read_text(encoding='utf-8')
          pot = pot.replace('#: views/admin-page.php:113\nmsgid "Image Usage Audit"', '#: views/admin-page.php:114\nmsgid "Image Usage Audit"')
          pot = re.sub(
              r'(#: views/admin-page\.php:)(\d+)',
              lambda match: match.group(1) + str(int(match.group(2)) + 1) if int(match.group(2)) >= 119 else match.group(0),
              pot,
          )
          pot_path.write_text(pot, encoding='utf-8', newline='\n')

          Path('.github/workflows/publish-3.0.0.yml').unlink(missing_ok=True)
          PY

      - name: Validate generated metadata and package
        run: |
          npm ci
          npm audit --audit-level=high
          npm run validate:metadata
          npm run validate:config
          php -l image-usage-audit.php
          php -l views/admin-page.php
          npm run build:zip

      - name: Commit the prepared release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -- README.md readme.txt image-usage-audit.php languages/image-usage-audit.pot assets/admin.css assets/image-usage-audit-mark.svg views/admin-page.php scripts/validate-metadata.mjs scripts/verify-wordpress-org-submission.ps1 scripts/prepare-wordpress-org-svn.ps1 docs/wordpress-org .wordpress-org
          git commit -m 'feat: apply 3.0.0 visual identity and release metadata'
          git push origin HEAD:chore/wordpress-org-submission-assets
